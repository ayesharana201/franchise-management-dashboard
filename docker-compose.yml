services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: franchise
      DB_USERNAME: franchise
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - storage:/var/www/html/storage
      - public:/var/www/html/public   # first start copies built assets into the shared volume for nginx
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    depends_on:
      - app

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: franchise
      DB_USERNAME: franchise
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: franchise
      MYSQL_USER: franchise
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  storage:
  public:
